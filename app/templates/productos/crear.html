
{% extends 'base.html' %}

{% block title %}Nuevo producto - TechBol{% endblock %}

{% block content %}

<h2>Registrar producto</h2>

<form method="POST" class="card p-4 shadow-sm">

    <label class="form-label">Nombre</label>
    <input type="text" name="nombre"
           class="form-control mb-3" required>

    <label class="form-label">Precio</label>
    <input type="number" step="0.01" min="0.01"
           name="precio" class="form-control mb-3" required>

    <label class="form-label">Stock</label>
    <input type="number" min="0"
           name="stock" class="form-control mb-3" required>

    <button class="btn btn-success">Guardar producto</button>

    <a href="{{ url_for('productos.listar_productos') }}"
       class="btn btn-secondary mt-2">
        Volver
    </a>

</form>

{% endblock %}
